<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ديوان أوتاري - مرجع المقامات والوصلات الطربية</title>
    <style>
        body {
            font-family: 'Tahoma', sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        header {
            text-align: center;
            padding: 20px;
            background: #1f1f1f;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            position: relative;
        }
        h1 {
            color: #d4af37;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        /* تنسيق زر المفضلة العلوي */
        .fav-top-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #2b2b2b;
            color: #e74c3c;
            border: 1px solid #d4af37;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            z-index: 10;
            transition: 0.3s;
        }
        .fav-top-btn:hover {
            background-color: #d4af37;
            color: #121212;
        }
        .btn-admin {
            background-color: #d4af37;
            color: #121212;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        .btn-admin:hover {
            background-color: #f39c12;
        }
        .admin-controls {
            display: none;
            margin-top: 15px;
            background: #2b2b2b;
            padding: 15px;
            border-radius: 8px;
            border: 1px dashed #d4af37;
        }
        .maqamat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .maqam-card {
            background: rgba(30, 30, 30, 0.85);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #d4af37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
            cursor: pointer;
            transition: 0.3s;
        }
        .maqam-card:hover {
            background: rgba(45, 45, 45, 0.95);
            transform: translateY(-3px);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }
        .maqam-card h3 {
            margin: 0;
            color: #ffffff;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }
        .modal-content {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 12px;
            max-width: 700px;
            width: 100%;
            border: 2px solid #d4af37;
            height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.3);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }
        .close-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .back-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            display: none;
        }
        .waslat-buttons-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }
        .wasla-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .wasla-tab-btn {
            background: #2b2b2b;
            color: #d4af37;
            border: 1px solid #d4af37;
            padding: 15px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            text-align: right;
            flex: 1;
            transition: 0.3s;
        }
        .wasla-tab-btn:hover {
            background: #d4af37;
            color: #121212;
        }
        /* تنسيق زر القلب الصفاف بجانب كل وصلة */
        .heart-btn {
            background: #2b2b2b;
            border: 1px solid #d4af37;
            color: #777;
            font-size: 20px;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .heart-btn.active {
            color: #e74c3c;
            background: rgba(231, 76, 60, 0.15);
        }
        .heart-btn:hover {
            transform: scale(1.05);
            color: #e74c3c;
        }
        .lyrics-box {
            background: #121212;
            padding: 20px;
            border-radius: 8px;
            border-right: 5px solid #d4af37;
            margin-top: 15px;
            line-height: 2;
            font-size: 16px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            color: #d4af37;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group select, .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            background: #2b2b2b;
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
            font-family: 'Tahoma', sans-serif;
        }
        .admin-action-btns {
            margin-top: 20px;
            display: none;
            gap: 10px;
        }
        .btn-edit {
            background-color: #f39c12;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-delete {
            background-color: #e74c3c;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <!-- زر المفضلة العلوي الصغير في أعلى اليسار -->
        <button class="fav-top-btn" onclick="openFavoritesModal()">❤️ المفضلة (<span id="favCount">0</span>)</button>

        <h1>🎵 ديوان أوتاري 🎵</h1>
        <p>المرجع الشامل للمقامات والوصلات الغنائية الأصيلة</p>
        
        <button id="loginBtn" class="btn-admin" onclick="loginAdmin()">دخول المشرف (أدمن)</button>
        <button id="logoutBtn" class="btn-admin" style="background-color: #e74c3c; display: none;" onclick="logoutAdmin()">خروج المشرف</button>

        <div id="adminPanel" class="admin-controls">
            <h3 style="color: #d4af37; margin-top: 0;">لوحة تحكم المشرف</h3>
            <button class="btn-admin" onclick="openAddModal()">+ إضافة إلى الديوان</button>
        </div>
    </header>

    <div class="container">
        <h2 style="text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px;">المقامات والقوائم العربية</h2>
        <div class="maqamat-grid" id="maqamatContainer"></div>
    </div>

    <!-- نافذة القائمة الكبيرة للوصلات والمواويل -->
    <div id="waslatModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <button id="backBtn" class="back-btn" onclick="showWaslatList()">رجوع للقائمة</button>
                <h2 id="modalTitle" style="color: #d4af37; margin: 0;"></h2>
                <button class="close-btn" onclick="closeModal()">إغلاق</button>
            </div>
            
            <div id="modalBody" class="modal-body"></div>
            
            <div id="adminActionBtns" class="admin-action-btns">
                <button class="btn-edit" onclick="editCurrentWasla()">✏️ تعديل الكلمات</button>
                <button class="btn-delete" onclick="deleteCurrentWasla()">🗑️ حذف العنصر</button>
            </div>
        </div>
    </div>

    <!-- نافذة نموذج الإضافة المرتبة -->
    <div id="addModal" class="modal">
        <div class="modal-content" style="height: auto; max-height: 85vh;">
            <div class="modal-header">
                <h2 style="color: #d4af37; margin: 0;">إضافة عنصر جديد إلى الديوان</h2>
                <button class="close-btn" onclick="closeAddModal()">إغلاق</button>
            </div>
            
            <div class="modal-body">
                <div class="form-group">
                    <label>1. القسم (المقام أو المواويل):</label>
                    <select id="addMaqamSelect"></select>
                </div>

                <div class="form-group">
                    <label>2. الاسم:</label>
                    <input type="text" id="addWaslaName" placeholder="مثال: موال أعرج سبعاوي، أو وصلة طرب...">
                </div>

                <div class="form-group">
                    <label>3. الكلمات:</label>
                    <textarea id="addItemLyrics" rows="6" placeholder="اكتب الكلمات هنا..."></textarea>
                </div>

                <button class="btn-admin" style="width: 100%; padding: 12px; margin-top: 10px;" onclick="saveNewItem()">حفظ الإضافة في الديوان</button>
            </div>
        </div>
    </div>

    <script>
        let adminPasswordKey = "alfares1999"; 

        let database = {
            saba: { 
                name: "مقام الصبا", 
                waslat: [
                    { title: "الوصلة الأولى", items: [{ type: "موشح", title: "غضي جفونك يا عيون", lyrics: "غُضِّي جُفُونَكِ يَا عُيُونُ .. وَكَفْكِفِي دَمْعَ الهَوَانْ" }] },
                    { title: "الوصلة الثانية", items: [{ type: "قد", title: "يا طيرة طيري", lyrics: "يَا طَيْرَةْ طِيرِي يَا حَمَامَةْ طِيرِي .. عَالشَّامِ روحي" }] }
                ]
            },
            nahawand: { 
                name: "مقام النهاوند", 
                waslat: [
                    { title: "الوصلة الأولى", items: [{ type: "موشح", title: "يا بهجة الروح", lyrics: "يَا بَهْجَةَ الرُّوحِ جُودِي .. وَأَنْعِمِي بِالوِصَالِ" }] }
                ]
            },
            ajam: { name: "مقام العجم", waslat: [] },
            bayati: { name: "مقام البيات", waslat: [] },
            sikah: { name: "مقام السيكاه", waslat: [] },
            hijaz: { name: "مقام الحجاز", waslat: [] },
            rast: { name: "مقام الرصد", waslat: [] },
            kurd: { name: "مقام الكرد", waslat: [] },
            mawamil: { 
                name: "🎵 المواويل السبعاوية", 
                waslat: [
                    { title: "موال أُلفي", items: [{ type: "موال", title: "يا من هواه أعزه وأذلني", lyrics: "يَا مَنْ هَوَاهُ أَعَزَّهُ وَأَذَلَّنِي .. كَيْفَ السَّبِيلُ إِلَى وِصَالِكَ دُلَّنِي" }] }
                ]
            },
            dabkat: { name: "دبكات وأهازيج", waslat: [] },
            qasaid: { name: "قصائد", waslat: [] },
            favorites: { name: "❤️ المفضلة", waslat: [] }
        };

        let isAdmin = false;
        let currentOpenMaqam = null;
        let currentWaslaIndex = null;

        function renderMaqamat() {
            let container = document.getElementById('maqamatContainer');
            container.innerHTML = '';
            
            for (let key in database) {
                if (key === 'favorites') continue;

                let maqam = database[key];
                let card = document.createElement('div');
                card.className = 'maqam-card';
                card.innerHTML = `<h3>${maqam.name}</h3><p style="color: #aaa; font-size: 13px; margin: 5px 0 0;">${maqam.waslat.length} عناصر متاحة</p>`;
                card.onclick = function() {
                    openMaqamModal(key);
                };
                container.appendChild(card);
            }
            populateMaqamSelect();
            updateFavCount();
        }

        function updateFavCount() {
            let countEl = document.getElementById('favCount');
            if (countEl) {
                countEl.innerText = database.favorites.waslat.length;
            }
        }

        function populateMaqamSelect() {
            let select = document.getElementById('addMaqamSelect');
            select.innerHTML = '';
            for (let key in database) {
                if (key === 'favorites') continue;
                let opt = document.createElement('option');
                opt.value = key;
                opt.innerText = database[key].name;
                select.appendChild(opt);
            }
        }

        function loginAdmin() {
            let pass = prompt("🔐 أدخل كلمة سر المشرف:");
            if (pass === adminPasswordKey) {
                isAdmin = true;
                document.getElementById('adminPanel').style.display = 'block';
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'inline-block';
                alert("✨ أهلاً بك يا أبو الفارس، تم تفعيل صلاحيات المشرف بنجاح!");
            } else if (pass !== null) {
                alert("❌ كلمة السر غير صحيحة.");
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('loginBtn').style.display = 'inline-block';
            document.getElementById('logoutBtn').style.display = 'none';
            document.getElementById('adminActionBtns').style.display = 'none';
            alert("🔒 تم تسجيل الخروج بنجاح.");
        }

        function openMaqamModal(key) {
            currentOpenMaqam = key;
            showWaslatList();
            document.getElementById('waslatModal').style.display = 'flex';
        }

        function showWaslatList() {
            document.getElementById('backBtn').style.display = 'none';
            document.getElementById('adminActionBtns').style.display = 'none';
            let maqam = database[currentOpenMaqam];
            document.getElementById('modalTitle').innerText = maqam.name;

            let bodyHTML = '';
            if (maqam.waslat.length === 0) {
                bodyHTML = '<p style="color: #888; text-align: center; padding: 40px; font-size: 16px;">لا توجد عناصر مضافة هنا بعد.</p>';
            } else {
                bodyHTML = '<p style="color: #d4af37; text-align: center; font-size: 15px; margin-bottom: 15px;">اختر العنصر المطلوب لعرض كلماته:</p><div class="waslat-buttons-container">';
                maqam.waslat.forEach((wasla, index) => {
                    let isFav = database.favorites.waslat.some(fav => fav.title === wasla.title && fav.items[0].lyrics === wasla.items[0].lyrics);
                    let heartClass = isFav ? "heart-btn active" : "heart-btn";

                    bodyHTML += `<div class="wasla-row">
                                    <button class="wasla-tab-btn" onclick="showWaslaLyrics(${index})">🎵 ${wasla.title}</button>
                                    <button class="${heartClass}" onclick="toggleFavorite(event, '${currentOpenMaqam}', ${index})" title="إضافة للمفضلة">❤️</button>
                                 </div>`;
                });
                bodyHTML += `</div>`;
            }
            document.getElementById('modalBody').innerHTML = bodyHTML;
        }

        function openFavoritesModal() {
            currentOpenMaqam = 'favorites';
            document.getElementById('backBtn').style.display = 'none';
            document.getElementById('adminActionBtns').style.display = 'none';
            document.getElementById('modalTitle').innerText = "❤️ المفضلة المحفوظة";

            let maqam = database.favorites;
            let bodyHTML = '';
            if (maqam.waslat.length === 0) {
                bodyHTML = '<p style="color: #888; text-align: center; padding: 40px; font-size: 16px;">لم تقم بإضافة أي وصلات إلى المفضلة بعد.</p>';
            } else {
                bodyHTML = '<p style="color: #d4af37; text-align: center; font-size: 15px; margin-bottom: 15px;">الوصلات المفضلة لديك:</p><div class="waslat-buttons-container">';
                maqam.waslat.forEach((wasla, index) => {
                    bodyHTML += `<div class="wasla-row">
                                    <button class="wasla-tab-btn" onclick="showFavoriteLyrics(${index})">❤️ ${wasla.title}</button>
                                 </div>`;
                });
                bodyHTML += `</div>`;
            }
            document.getElementById('modalBody').innerHTML = bodyHTML;
            document.getElementById('waslatModal').style.display = 'flex';
        }

        function showWaslaLyrics(index) {
            currentWaslaIndex = index;
            document.getElementById('backBtn').style.display = 'block';
            
            if (isAdmin) {
                document.getElementById('adminActionBtns').style.display = 'flex';
            } else {
                document.getElementById('adminActionBtns').style.display = 'none';
            }

            let wasla = database[currentOpenMaqam].waslat[index];
            document.getElementById('modalTitle').innerText = wasla.title;

            let lyricsHTML = `<div class="lyrics-box">`;
            wasla.items.forEach(item => {
                lyricsHTML += `<p style="white-space: pre-wrap; font-size: 16px; color: #f1f1f1; margin: 0;">${item.lyrics}</p>`;
            });
            lyricsHTML += `</div>`;
            
            document.getElementById('modalBody').innerHTML = lyricsHTML;
        }

        function showFavoriteLyrics(index) {
            document.getElementById('backBtn').style.display = 'block';
            document.getElementById('adminActionBtns').style.display = 'none';

            let wasla = database.favorites.waslat[index];
            document.getElementById('modalTitle').innerText = wasla.title;

            let lyricsHTML = `<div class="lyrics-box">`;
            wasla.items.forEach(item => {
                lyricsHTML += `<p style="white-space: pre-wrap; font-size: 16px; color: #f1f1f1; margin: 0;">${item.lyrics}</p>`;
            });
            lyricsHTML += `</div>`;
            
            document.getElementById('modalBody').innerHTML = lyricsHTML;
        }

        // دالة تفعيل القلب الأحمر لإضافة أو إزالة العنصر من المفضلة
        function toggleFavorite(event, maqamKey, index) {
            event.stopPropagation();
            let targetWasla = database[maqamKey].waslat[index];
            
            let favIndex = database.favorites.waslat.findIndex(fav => fav.title === targetWasla.title && fav.items[0].lyrics === targetWasla.items[0].lyrics);

            if (favIndex > -1) {
                database.favorites.waslat.splice(favIndex, 1);
                event.target.classList.remove('active');
                alert("🗑️ تمت الإزالة من المفضلة.");
            } else {
                database.favorites.waslat.push(JSON.parse(JSON.stringify(targetWasla)));
